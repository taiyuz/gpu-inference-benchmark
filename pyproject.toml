[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-bench"
version = "0.1.0"
description = "GPU inference runtime comparison: PyTorch, ONNX Runtime, and TensorRT 10"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taiyu Zhu" }]
keywords = ["cuda", "tensorrt", "inference", "pytorch", "onnxruntime"]
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/taiyuz/gpu-inference-benchmark"
Issues = "https://github.com/taiyuz/gpu-inference-benchmark/issues"

[project.optional-dependencies]
torch = [
    "torch>=2.4",
    "torchvision>=0.19",
]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
cuda = [
    "onnxruntime-gpu>=1.18",
]
tensorrt = [
    # NGC images already ship TensorRT; this extra is for environments that need the pip wheel.
    "tensorrt>=10.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
gpu-bench = "gpu_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_bench"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
