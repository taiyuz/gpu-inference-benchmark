name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CPU-only CI. Do not call nvidia-smi. Do not request GPU runners.
      UV_SYSTEM_PYTHON: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install CPU-only deps and run tests
        run: |
          uv python install 3.12
          uv sync --extra dev
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv run pytest -q
